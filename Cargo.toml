[package]
name = "driftdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Embedded time-series storage engine with Gorilla compression, LSM segments and a small query language"
license = "MIT"
authors = ["James Lee"]
readme = "README.md"
keywords = ["time-series", "database", "lsm", "gorilla", "storage"]
categories = ["database-implementations"]

[lib]
name = "driftdb"
path = "src/lib.rs"

[[bin]]
name = "driftdb"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
parking_lot = "0.12"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
http-body-util = "0.1"
proptest = "1.5"
tempfile = "3.12"
tower = { version = "0.5", features = ["util"] }

[profile.release]
debug = 1

[profile.bench]
debug = 1
